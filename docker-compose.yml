services:
  web:
    image: alphabloo7/s1-pend-sejarah:latest
    container_name: s1-pend-sejarah-web
    restart: always
    ports:
      - "8093:80" # Ubah port 8093 jika port tersebut sudah terpakai di server VPS Anda
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
